<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#207D69">
<meta name="color-scheme" content="only light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Minhas Finanças</title>
<script>try{ if(JSON.parse(localStorage.getItem('mf-lock')||'null')) document.documentElement.classList.add('locked'); }catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  html{background:#F7F8F5}
  :root{ color-scheme: only light;
    /* Identidade visual "Minhas Finanças" */
    --bg:#F7F8F5; --card:#FFFFFF; --ink:#1B2621; --muted:#66706B; --line:#E3E7E2;
    --brand:#207D69; --brand-dark:#17604F; --brand-soft:#DCEFE8;
    --inc:#0E7A5A; --exp:#D97856; --exp-soft:#FBEAE3;          /* gráfico: receitas / despesas */
    --p1:#2F6FB5; --p1-soft:#E4EEF9; --p2:#B8860B; --p2-soft:#F7EED6; /* pessoas */
    --danger:#C62828; --danger-soft:#FDECEA; --alert:#B45309; --alert-soft:#FEF3C7; --ok:#207D69;
    --radius:16px; --shadow:0 1px 2px rgba(27,38,33,.06),0 2px 8px rgba(27,38,33,.04);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  button,input,select{font:inherit;color:inherit}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
  .month{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .month h1{margin:0;font-size:1.15rem;font-weight:600;}
  .iconbtn{border:0;background:var(--card);width:40px;height:40px;border-radius:50%;font-size:1.2rem;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
  main{padding:12px 16px calc(96px + var(--safe-b));max-width:720px;margin:0 auto}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
  nav.tabs button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:.7rem;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  nav.tabs button .ico{width:24px;height:24px}
  nav.tabs button.on{color:var(--brand);font-weight:600}
  .fab.wide{width:auto;height:56px;border-radius:28px;padding:0 22px 0 18px;font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:6px}
  .fab.wide b{font-size:1.6rem;font-weight:400;line-height:1}
  .fab{position:fixed;right:18px;bottom:calc(76px + var(--safe-b));z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:1.8rem;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .card h2{margin:0 0 10px;font-size:1rem;font-weight:600;display:flex;align-items:center;gap:8px}
  .big{font-size:1.7rem;font-weight:700;letter-spacing:-.5px}
  .muted{color:var(--muted);font-size:.85rem}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .person{border-radius:12px;padding:12px}
  .person.p1{background:var(--p1-soft)} .person.p2{background:var(--p2-soft)}
  .person .name{font-weight:600;font-size:.9rem}
  .person.p1 .name{color:var(--p1)} .person.p2 .name{color:var(--p2)}
  .person .total{font-size:1.25rem;font-weight:700;margin:2px 0 6px}
  .row{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;padding:2px 0}
  .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex;margin-top:4px}
  .bar i{display:block;height:100%}
  .catrow{padding:8px 0;border-bottom:1px solid var(--line)} .catrow:last-child{border-bottom:0}
  .seg{display:flex;background:var(--card);box-shadow:0 0 0 1px var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px;overflow-x:auto}
  .seg button{flex:1;border:0;background:none;padding:7px 10px;border-radius:8px;font-size:.85rem;white-space:nowrap;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .item:last-child{border-bottom:0}
  .item .main{flex:1;min-width:0}
  .item .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .sub{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .val{text-align:right;font-weight:600;white-space:nowrap}
  .item .val small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
  .chip{display:inline-block;font-size:.7rem;font-weight:600;padding:1px 7px;border-radius:20px;margin-right:4px;vertical-align:1px}
  .chip.p1{background:var(--p1-soft);color:var(--p1)} .chip.p2{background:var(--p2-soft);color:var(--p2)}
  .chip.fix{background:var(--brand-soft);color:var(--brand)} .chip.var{background:var(--line);color:var(--muted)}
  .check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;cursor:pointer;display:grid;place-items:center;font-size:.9rem;color:#fff}
  .check.on{background:var(--ok);border-color:var(--ok)}
  .empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:.9rem}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + var(--safe-b))}
  .sheet h3{margin:0 0 14px;font-size:1.1rem}
  label.f{display:block;margin-bottom:12px;font-size:.8rem;color:var(--muted);font-weight:600}
  label.f input,label.f select{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:1rem;font-weight:400}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions{display:flex;gap:10px;margin-top:6px}
  .btn{flex:1;border:1.5px solid var(--brand);border-radius:12px;padding:12px;font-weight:600;cursor:pointer;background:var(--card);color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.danger{background:none;color:var(--danger);border-color:var(--danger)}
  .pick{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
  .pick button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600}
  .pick button.on.p1{background:var(--p1-soft);border-color:var(--p1);color:var(--p1)}
  .pick button.on.p2{background:var(--p2-soft);border-color:var(--p2);color:var(--p2)}
  .pick button.on.neutral{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
  .hint{font-size:.8rem;color:var(--muted);margin:-6px 0 12px}
  .listedit{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
  .listedit span{flex:1}
  .listedit button{border:0;background:none;color:var(--danger);font-size:1.1rem;cursor:pointer}
  .addline{display:flex;gap:8px;margin-top:8px}
  .addline input{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  .addline button{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:0 16px;font-weight:600}
  .obs{font-size:.8rem;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .authwrap{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 40px) 20px 40px}
  .authwrap[hidden]{display:none}
  .authbox{width:100%;max-width:380px;text-align:center}
  .authbox img{border-radius:16px} .authbox h2{margin:10px 0 20px}
  .authbox label.f{text-align:left}
  .btn.google{width:100%;background:var(--card);box-shadow:0 0 0 1px var(--line)}
  .or{margin:14px 0;color:var(--muted);font-size:.85rem}
  .link{border:0;background:none;color:var(--brand);margin-top:16px;font-weight:600;cursor:pointer}
  .err{color:var(--danger);font-size:.9rem}
  .payrow{display:grid;grid-template-columns:1.3fr .6fr 1fr auto;gap:6px;margin-bottom:6px}
  .payrow select,.payrow input{padding:9px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
  .payrow button{border:0;background:none;color:var(--danger);font-size:1.1rem;cursor:pointer}
  .legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-bottom:6px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .chartsel{display:flex;flex-direction:column;gap:2px;font-size:.85rem;background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:6px}
  .mtable{width:100%;border-collapse:collapse;font-size:.82rem}
  .mtable th{text-align:right;color:var(--muted);font-weight:600;padding:4px 2px;border-bottom:1px solid var(--line)}
  .mtable td{text-align:right;padding:9px 2px;border-bottom:1px solid var(--line);white-space:nowrap}
  .mtable th:first-child,.mtable td:first-child{text-align:left}
  .mtable tr[data-gomonth]{cursor:pointer}
  .spend{border-left:5px solid var(--brand)} .spend.bad{border-left-color:var(--danger)}
  .bbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
  .bbar i{display:block;height:100%;border-radius:6px}
  .tag{display:inline-block;margin-top:10px;padding:6px 12px;border-radius:20px;font-size:.85rem;font-weight:600}
  .tag.good{background:var(--brand-soft);color:var(--brand-dark)} .tag.mid{background:var(--alert-soft);color:var(--alert)} .tag.bad{background:var(--danger-soft);color:var(--danger)}
  #lock{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  html.locked #lock{display:flex} html.locked body{overflow:hidden}
  #lock img{width:72px;height:72px;border-radius:18px} #lock h2{margin:12px 0 4px}
  .dots{display:flex;gap:14px;justify-content:center;margin:22px 0 10px}
  .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand);display:block} .dots i.on{background:var(--brand)}
  .keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center;margin-top:12px}
  .keypad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.6rem;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
  .keypad button.ghost{background:none;border:0;box-shadow:none;font-size:1rem;color:var(--brand)}
  .shake{animation:shake .35s} @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cwd{text-align:center;font-size:.75rem;color:var(--muted);font-weight:600;padding:2px 0}
  .cday{position:relative;aspect-ratio:1;border:0;border-radius:12px;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.95rem;color:var(--ink);padding:0}
  .cday.today span{background:var(--brand-soft);color:var(--brand-dark);font-weight:700;border-radius:50%;width:28px;height:28px;display:grid;place-items:center}
  .cday.sel{outline:2px solid var(--brand);outline-offset:-2px}
  .cdot{min-width:8px;height:8px;border-radius:8px;display:block;font-style:normal;font-size:.62rem;line-height:14px;color:#fff;font-weight:700;padding:0}
  .cdot:not(:empty){height:14px;padding:0 4px}
  .cdot.late{background:var(--danger)} .cdot.open{background:var(--alert)} .cdot.paid{background:var(--brand)}
  .neg{color:var(--danger)!important}
  .ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .card h2 .ico{color:var(--brand);width:20px;height:20px}
  .brandbar{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:700;color:var(--brand-dark);font-size:.95rem;margin-bottom:6px}
  .brandbar img{width:22px;height:22px;border-radius:6px} .pos{color:var(--ok)}
  .warn{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:.88rem;font-weight:600;margin-top:10px}
  .payhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
  .payhead .amt{border:0;background:var(--brand-soft);color:var(--brand);font-weight:700;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:.95rem}
  .sumline{display:flex;justify-content:space-between;font-size:.88rem;padding:3px 0}
  .sumline.total{font-weight:700;font-size:1rem;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
  .chip.card{background:var(--p2-soft);color:var(--p2)}
  .toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:.9rem;z-index:30}
</style>
</head>
<body>
<header>
  <div class="brandbar"><img src="icons/icon-192.png" alt="">Minhas Finanças</div>
  <div class="month">
    <button class="iconbtn" id="prev" aria-label="Mês anterior">‹</button>
    <h1 id="monthTitle"></h1>
    <button class="iconbtn" id="next" aria-label="Próximo mês">›</button>
  </div>
</header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Adicionar">+</button>
<div id="auth" class="authwrap"></div>
<div id="lock" aria-modal="true" role="dialog"></div>
<nav class="tabs">
  <button data-tab="resumo" class="on"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>Início</button>
  <button data-tab="salarios"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="9" cy="6" rx="6" ry="2.5"/><path d="M3 6v4c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V6"/><path d="M3 10v4c0 1.4 2.7 2.5 6 2.5"/><ellipse cx="16" cy="14" rx="5" ry="2.2"/><path d="M11 14v4c0 1.2 2.2 2.2 5 2.2s5-1 5-2.2v-4"/></svg>Salários</button>
  <button data-tab="contas"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 3v3M16 3v3"/><path d="M7.5 13.5h3M7.5 17h6"/></svg>Contas</button>
  <button data-tab="cartao"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/></svg>Cartão</button>
  <button data-tab="config"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/><circle cx="12" cy="12" r="6.3"/></svg>Ajustes</button>
</nav>

<script type="module">
/* ---------- Firebase ---------- */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, signOut } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection,
  onSnapshot, setDoc, deleteDoc, writeBatch } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCKKJjK6gz4MhByI0Kv_5SZ8ta4fTUfhs8",
  authDomain: "financas-a8955.firebaseapp.com",
  projectId: "financas-a8955",
  storageBucket: "financas-a8955.firebasestorage.app",
  messagingSenderId: "900343784733",
  appId: "1:900343784733:web:1bff41693287ce99266df4"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp); auth.languageCode = 'pt';
let fs;
try { fs = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch(e) { fs = initializeFirestore(fbApp, {}); }
const casa = doc(fs, 'casas', 'principal');
const COLS = ['fixed','variable','purchases','receitas','savings'];

/* ---------- Dados ---------- */
const OLDKEY = 'financas-casa-v1';
const DEFAULT = {
  people: { p1: 'Eu', p2: 'André' },
  categories: ['Moradia','Contas da casa','Mercado','Transporte','Saúde','Educação','Lazer','Assinaturas','Bijuterias da Vanessa','Outros'],
  cards: ['Cartão 1','Cartão 2'],
  fixed: [],    // {id, desc, cat, value, day, payer, start, end, paid:{'YYYY-MM':'data/hora'}, obs}
  variable: [], // {id, date, desc, cat, value, payer, paid, obs}
  purchases: [],// {id, date, card, desc, cat, owner, n, inst, first, obs}
  receitas: [], // {id, desc, cat, value, who, date:'YYYY-MM-DD', monthly, end:'YYYY-MM'|null, obs}
  incomeCats: ['Salário','Férias','13º salário','Extra','INSS','Outros'],
  savings: [],  // {id, box, who, kind:'in'|'out', value, date, monthly, end, obs}
  boxes: ['Poupança','Caixinha Nubank','Cofrinho Mercado Pago'],
  budget: {},   // {p1:{total:3200, cats:{'Mercado':800}}, p2:{...}} — orçamento mensal de gastos
  cardPaid: {}, // {'YYYY-MM|cartão|p1': 'data/hora'}
  // Recebimentos: rule 'day' = dia fixo do mês; 'bday' = Nº dia útil (seg–sex, sem feriados nacionais)
  income: {
    p1: { track: true,  pays: [ {id:'d15', rule:'day', n:15, amount:0}, {id:'d30', rule:'day', n:30, amount:0} ] },
    p2: { track: false, pays: [ {id:'bd5', rule:'bday', n:5, amount:0} ] }
  },
  cardInfo: {},   // {'Nubank': {due:10, pay:{p1:{pd,off}, p2:{pd,off}}}}
  incomeMonth: {} // {'YYYY-MM|p1|d15': valor recebido naquele mês}
};
let db = structuredClone(DEFAULT);
const clean = o => JSON.parse(JSON.stringify(o));
const cpId = k => encodeURIComponent(k).replace(/\./g,'%2E');
function putItem(col,o){ setDoc(doc(casa,col,o.id), clean(o)).catch(writeErr); }
function delItem(col,id){ deleteDoc(doc(casa,col,id)).catch(writeErr); }
function putConfig(){ setDoc(casa, clean({people:db.people,categories:db.categories,cards:db.cards,income:db.income,cardInfo:db.cardInfo,incomeCats:db.incomeCats,boxes:db.boxes,budget:db.budget}), {merge:true}).catch(writeErr); }
function setIncome(k,v){ const r=doc(casa,'income',cpId(k)); (v!=null?setDoc(r,{k,v}):deleteDoc(r)).catch(writeErr); }
function setCardPaid(k,at){ const r=doc(casa,'cardPaid',cpId(k)); (at?setDoc(r,{k,at}):deleteDoc(r)).catch(writeErr); }
function writeErr(e){ console.error(e); toast(e.code==='permission-denied'?'Sem permissão para salvar':'Erro ao salvar: '+(e.code||e.message)); }
async function bulk(ops){ // ops: [ [ref, data|null], ... ]
  for(let i=0;i<ops.length;i+=400){ const b=writeBatch(fs); ops.slice(i,i+400).forEach(([r,d])=>d?b.set(r,d):b.delete(r)); await b.commit(); }
}
async function importAll(d, replace){
  const ops=[];
  if(replace){ COLS.forEach(c=>db[c].forEach(o=>ops.push([doc(casa,c,o.id),null]))); Object.keys(db.cardPaid).forEach(k=>ops.push([doc(casa,'cardPaid',cpId(k)),null]));
    Object.keys(db.incomeMonth).forEach(k=>ops.push([doc(casa,'income',cpId(k)),null])); }
  Object.entries(d.incomeMonth||{}).forEach(([k,v])=>{ if(v!=null) ops.push([doc(casa,'income',cpId(k)),{k,v}]); });
  COLS.forEach(c=>(d[c]||[]).forEach(o=>{ if(o&&o.id) ops.push([doc(casa,c,o.id),clean(o)]); }));

/* ---------- Sincronização ---------- */
let unsubs=[], rTimer=null, gotConfig=false, quickDone=false;
// Não redesenha a tela enquanto a pessoa está digitando num campo; redesenha quando ela sai do campo.
let renderPending=false;
const typing=()=>{ const a=document.activeElement; return a && view && view.contains(a) && (a.tagName==='INPUT'||a.tagName==='SELECT'); };
const scheduleRender=()=>{ clearTimeout(rTimer); rTimer=setTimeout(()=>{ if(!gotConfig) return; hideAuth(); if(typing()){ renderPending=true; return; } render(); },30); };
document.addEventListener('focusout',()=>setTimeout(()=>{ if(renderPending && !typing()){ renderPending=false; render(); } },60));
function stopSync(){ unsubs.forEach(u=>u()); unsubs=[]; gotConfig=false; db=structuredClone(DEFAULT); }
function syncErr(e){ console.error(e); if(e.code==='permission-denied') showAuth('denied'); else toast('Erro de sincronização: '+(e.code||e.message)); }
function startSync(){
  stopSync();
  unsubs.push(onSnapshot(casa, s=>{
    const d=s.data();
    if(d){ ['people','categories','cards','income','cardInfo','incomeCats','boxes','budget'].forEach(k=>{ if(d[k]) db[k]=d[k]; }); }
    else if(!s.metadata.fromCache){ putConfig(); }
    gotConfig=true; scheduleRender();
    if(!quickDone && new URLSearchParams(location.search).get('nova')==='despesa'){ quickDone=true; history.replaceState(null,'',location.pathname);
      setTimeout(()=>{ tab='resumo'; render(); formConta('var'); },120); }
  }, syncErr));
  COLS.forEach(c=>unsubs.push(onSnapshot(collection(casa,c), s=>{ db[c]=s.docs.map(d=>({...d.data(), id:d.id})); scheduleRender(); }, syncErr)));
  unsubs.push(onSnapshot(collection(casa,'income'), s=>{ db.incomeMonth=Object.fromEntries(s.docs.map(d=>[d.data().k,d.data().v])); scheduleRender(); }, syncErr));
  unsubs.push(onSnapshot(collection(casa,'cardPaid'), s=>{ db.cardPaid=Object.fromEntries(s.docs.map(d=>[d.data().k,d.data().at])); scheduleRender(); }, syncErr));
}

const LOCKKEY='mf-lock';

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))), unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPin(pin,salt){ const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+'|'+pin)); return b64(d); }

async function bioCreate(){
  const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),
    rp:{name:'Minhas Finanças',id:location.hostname}, user:{id:crypto.getRandomValues(new Uint8Array(16)),name:(auth.currentUser&&auth.currentUser.email)||'minhas-financas',displayName:'Minhas Finanças'},

}

  await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,
    allowCredentials:[{type:'public-key',id:unb64(id)}],userVerification:'required',timeout:60000}});

let lockedNow=false, hiddenAt=null, pinBuf='', fails=0, waitUntil=0;
function showLock(){
  const c=lockCfg(); if(!c) return; lockedNow=true; pinBuf=''; document.documentElement.classList.add('locked');
  const el=document.getElementById('lock');
  el.innerHTML=`<img src="icons/icon-192.png" alt=""><h2>Minhas Finanças</h2><p class="muted" id="lkMsg">Digite seu PIN${c.bio?' ou use a digital':''}</p>

    <button class="link" id="lkForgot">Esqueci o PIN</button>`;
  el.onclick=async e=>{ const b=e.target.closest('[data-k]'); if(!b) return; const k=b.dataset.k;
    if(k==='bio') return tryBio();

    if(k==='del') pinBuf=pinBuf.slice(0,-1); else if(pinBuf.length<c.len) pinBuf+=k;
    dots(); if(pinBuf.length===c.len) checkPin(); };
  document.getElementById('lkForgot').onclick=()=>{ if(!confirm('Para redefinir, o app vai sair da sua conta neste aparelho e remover o bloqueio. Depois é só entrar de novo e criar outro PIN. Continuar?')) return;

  const dots=()=>document.querySelectorAll('#lkDots i').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length));

    fails++; pinBuf=''; dots(); const d=document.getElementById('lkDots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
    if(fails>=5){ waitUntil=Date.now()+30000; fails=0; msg('PIN incorreto 5 vezes. Aguarde 30 segundos.'); } else msg('PIN incorreto. Tente de novo.'); }
  async function tryBio(){ try{ await bioCheck(c.bio); unlock(); }catch(e){ msg('Não foi possível usar a digital. Digite o PIN.'); } }

  });

const fixedValue = (f,k) => (f.values && f.values[k]!=null) ? f.values[k] : f.value;

function summary(k){
  const s = { p1:{fix:0,var:0,card:0,open:0}, p2:{fix:0,var:0,card:0,open:0}, cats:{}, cards:{} };
  const addCat=(c,who,v)=>{ s.cats[c]=s.cats[c]||{p1:0,p2:0}; s.cats[c][who]+=v; };
  fixedIn(k).forEach(f=>{ const fv=fixedValue(f,k); s[f.payer].fix+=fv; addCat(f.cat,f.payer,fv); if(!(f.paid&&f.paid[k])) s[f.payer].open+=fv; });
  variableIn(k).forEach(v=>{ s[v.payer].var+=v.value; addCat(v.cat,v.payer,v.value); if(!v.paid) s[v.payer].open+=v.value; });
  purchasesIn(k).forEach(p=>{ s[p.owner].card+=p.inst; addCat(p.cat,p.owner,p.inst);
    s.cards[p.card]=s.cards[p.card]||{p1:0,p2:0}; s.cards[p.card][p.owner]+=p.inst; });

  return s;
}

  return holidayCache[y]=new Set(['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25', pad2(gf.getMonth()+1)+'-'+pad2(gf.getDate())]);
}
function payDate(pay, k){ // data do recebimento no mês k
  const [y,m]=k.split('-').map(Number);
  if(pay.rule==='bday'){
    let count=0;
    for(let d=1; d<=lastDay(k); d++){ const dt=new Date(y,m-1,d), wd=dt.getDay();
      if(wd===0||wd===6||holidays(y).has(pad2(m)+'-'+pad2(d))) continue;
      if(++count===(pay.n||5)) return k+'-'+pad2(d); }
    return k+'-'+pad2(lastDay(k));
  }
  return k+'-'+pad2(Math.min(pay.n||1,lastDay(k)));
}
const payLabel = pay => pay.rule==='bday' ? `${pay.n}º dia útil` : `Dia ${pay.n}`;
const paysOf = who => ((db.income&&db.income[who]&&db.income[who].pays)||[]).filter(x=>x&&x.n);
const tracks = who => !!(db.income&&db.income[who]&&db.income[who].track);
const incKey = (k,who,id) => k+'|'+who+'|'+id;
const payAmount = (k,who,pay) => { const v=db.incomeMonth[incKey(k,who,pay.id)]; return v!=null ? v : (pay.amount||0); };
const cardDue = c => (db.cardInfo&&db.cardInfo[c]&&db.cardInfo[c].due) || 10;
const dueFixed = (f,k) => k+'-'+pad2(Math.min(f.day||1,lastDay(k)));
const dueVar = v => v.due || v.date;
const dueCard = (c,k) => k+'-'+pad2(Math.min(cardDue(c),lastDay(k)));
function autoPay(who, due){ // último salário recebido até o vencimento
  const D=due.slice(0,7); let best=null;
  [-1,0].forEach(off=>paysOf(who).forEach(pay=>{ const dt=payDate(pay,madd(D,off)); if(dt<=due && (!best||dt>best.date)) best={pd:pay.id,off,date:dt}; }));
  if(!best){ const p0=paysOf(who)[0]; if(p0) best={pd:p0.id,off:-1,date:payDate(p0,madd(D,-1))}; }
  return best;
}
function resolvePay(who, pw, due){
  const D=due.slice(0,7), pays=paysOf(who);
  const pay = pw && pays.find(x=>x.id===pw.pd);
  const r = pay ? {pd:pay.id, off:pw.off, date:payDate(pay,madd(D,pw.off))} : autoPay(who,due);
  if(!r) return null;
  return {...r, payMonth:madd(D,r.off)};
}
function payOptionsHTML(who, due, cur, fixed){
  const pays=paysOf(who); if(!pays.length) return `<option value="">Cadastre os salários de ${esc(pname(who))} em Ajustes</option>`;
  const D=due.slice(0,7), sel=cur?cur.pd+'|'+cur.off:'';
  return [-1,0].flatMap(off=>pays.map(pay=>{ const dt=payDate(pay,madd(D,off)), v=pay.id+'|'+off;
    const txt = fixed ? `${payLabel(pay)} do ${off?'mês anterior ao vencimento':'mesmo mês do vencimento'} (ex.: ${dshort(dt)})` : `${payLabel(pay)} – ${dshort(dt)}`;
    return {dt,html:`<option value="${v}" ${v===sel?'selected':''}>${esc(txt)}${dt>due?' ⚠ depois do vencimento':''}</option>`}; }))
    .sort((a,b)=>a.dt.localeCompare(b.dt)).map(x=>x.html).join('');
}
// Tudo o que cai nos salários recebidos no mês M
function obligations(M){
  const out=[];
  [M, madd(M,1)].forEach(D=>{
    fixedIn(D).forEach(f=>{ const due=dueFixed(f,D), r=resolvePay(f.payer,f.payWith,due);
      if(r&&r.payMonth===M) out.push({kind:'fix',who:f.payer,o:f,D,due,value:fixedValue(f,D),paid:f.paid&&f.paid[D],pd:r.pd,date:r.date,desc:f.desc}); });
    db.variable.forEach(v=>{ const due=dueVar(v); if(!due||due.slice(0,7)!==D) return; const r=resolvePay(v.payer,v.payWith,due);
      if(r&&r.payMonth===M) out.push({kind:'var',who:v.payer,o:v,D,due,value:v.value,paid:v.paid,pd:r.pd,date:r.date,desc:v.desc}); });
    const fat={}; purchasesIn(D).forEach(p=>{ const k=p.card+'|'+p.owner; (fat[k]=fat[k]||{card:p.card,who:p.owner,value:0,n:0}); fat[k].value+=p.inst; fat[k].n++; });
    Object.values(fat).forEach(x=>{ const due=dueCard(x.card,D), ci=db.cardInfo[x.card]||{}, r=resolvePay(x.who,ci.pay&&ci.pay[x.who],due);
      if(r&&r.payMonth===M) out.push({kind:'card',who:x.who,card:x.card,D,due,value:Math.round(x.value*100)/100,n:x.n,paid:db.cardPaid[cpKey(D,x.card,x.who)],pd:r.pd,date:r.date,desc:'Fatura '+x.card}); });
  });
  return out;
}
// Visão por salário de uma pessoa no mês M
function receitasIn(M, who){ // receitas que entram no mês M
  return (db.receitas||[]).filter(r=>r.who===who && r.date).map(r=>{
    if(r.monthly){ const s0=r.date.slice(0,7); if(mdiff(s0,M)<0 || (r.end && mdiff(M,r.end)<0)) return null;
      return {r, date:M+'-'+pad2(Math.min(+r.date.slice(8,10),lastDay(M)))}; }
    return r.date.slice(0,7)===M ? {r, date:r.date} : null;
  }).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));
}
function occurIn(list, M, pred){ // ocorrências no mês M de lançamentos com data, opcionalmente mensais
  return (list||[]).filter(pred).map(r=>{
    if(!r.date) return null;
    if(r.monthly){ const s0=r.date.slice(0,7); if(mdiff(s0,M)<0 || (r.end && mdiff(M,r.end)<0)) return null;
      return {r, date:M+'-'+pad2(Math.min(+r.date.slice(8,10),lastDay(M)))}; }
    return r.date.slice(0,7)===M ? {r, date:r.date} : null;
  }).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));
}
const savingsIn = (M, who) => occurIn(db.savings, M, x=>x.who===who);
function boxBalance(box){ // saldo até hoje
  const t=today(); let bal=0;
  (db.savings||[]).filter(x=>x.box===box && x.date).forEach(x=>{
    const months = x.monthly ? (()=>{ const out=[]; let k=x.date.slice(0,7); const lim=x.end&&mdiff(x.end,t.slice(0,7))<0?x.end:t.slice(0,7); let guard=0; while(mdiff(k,lim)>=0 && guard++<600){ out.push(k); k=madd(k,1); } return out; })() : [x.date.slice(0,7)];
    months.forEach(k=>{ const d=x.monthly?k+'-'+pad2(Math.min(+x.date.slice(8,10),lastDay(k))):x.date; if(d<=t) bal += x.kind==='out' ? -x.value : x.value; });
  });
  return Math.round(bal*100)/100;
}
function payPlan(M, who){
  const obs=obligations(M).filter(x=>x.who===who);
  const groups=paysOf(who).map(pay=>({pay,date:payDate(pay,M),amount:payAmount(M,who,pay),items:[]})).sort((a,b)=>a.date.localeCompare(b.date));
  obs.forEach(x=>{ const g=groups.find(g=>g.pay.id===x.pd); if(g) g.items.push(x); });
  let carry=0; const track=tracks(who);
  groups.forEach(g=>{ g.extras=[]; g.saves=[]; });
  const groupFor = d => { let g=null; groups.forEach(gr=>{ if(gr.date<=d) g=gr; }); return g||groups[0]; };
  receitasIn(M,who).forEach(x=>{ const g=groupFor(x.date); if(g) g.extras.push(x); }); // entra no período do salário recebido até a data
  savingsIn(M,who).forEach(x=>{ const g=groupFor(x.date); if(g) g.saves.push(x); });
  groups.forEach(g=>{ g.items.sort((a,b)=>a.due.localeCompare(b.due)); g.total=g.items.reduce((a,x)=>a+x.value,0);
    g.extra=g.extras.reduce((a,x)=>a+x.r.value,0);
    g.saved=g.saves.reduce((a,x)=>a+(x.r.kind==='out'?-x.r.value:x.r.value),0); // guardado (−) ou resgatado (+)
    g.open=g.items.filter(x=>!x.paid).reduce((a,x)=>a+x.value,0); g.carry=carry; g.saldo=carry+(track?g.amount+g.extra-g.saved:0)-g.total; carry=g.saldo; });
  const income=track?groups.reduce((a,g)=>a+g.amount+g.extra,0):0, spent=groups.reduce((a,g)=>a+g.total,0), saved=track?groups.reduce((a,g)=>a+g.saved,0):0;
  return {groups, income, spent, saved, result:income-spent-saved, track, neg:groups.some(g=>track&&g.saldo<0)};
}

let pWho='p1', pCat='month', pSel=null;
function chartSVG(rows){ // rows: [{k, inc, exp, res, neg}]
  const W=340, H=180, L=40, R=4, T=10, B=28, ih=H-T-B, iw=W-L-R;
  const max=Math.max(1,...rows.map(r=>Math.max(r.inc,r.exp)));
  const step=[1,2,2.5,5,10].map(m=>m*Math.pow(10,Math.floor(Math.log10(max/3)))).find(v=>max/v<=4)||max/3;
  const top=Math.ceil(max/step)*step, y=v=>T+ih-(v/top)*ih;
  const slot=iw/rows.length, bw=Math.min(18,(slot-14)/2);
  let g='';
  for(let v=step; v<=top+1e-9; v+=step) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="var(--muted)">${(v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':v)}</text>`;
  const bar=(x,v,c)=>{ const h=Math.max(v>0?2:0,(v/top)*ih), yy=T+ih-h, r=Math.min(4,h); 
    return h?`<path d="M${x},${T+ih} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${T+ih} Z" fill="${c}"/>`:''; };
  rows.forEach((r,i)=>{ const cx=L+slot*i+slot/2, sel=r.k===pSel;
    g+=`<g data-pmonth="${r.k}" style="cursor:pointer">
      <rect x="${L+slot*i}" y="${T}" width="${slot}" height="${ih+B}" fill="${sel?'var(--brand-soft)':'transparent'}" rx="6"/>
      ${bar(cx-bw-1,r.inc,'var(--inc)')}${bar(cx+1,r.exp,'var(--exp)')}
      <text x="${cx}" y="${H-10}" text-anchor="middle" font-size="10" fill="${r.neg?'var(--danger)':'var(--muted)'}" font-weight="${r.k===month?700:400}">${r.neg?'⚠ ':''}${esc(mshort(r.k))}</text></g>`; });
  g+=`<line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="var(--muted)" stroke-width="1"/>`;
  g+=`<text x="${L-6}" y="${T+ih+3}" text-anchor="end" font-size="9" fill="var(--muted)">0</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Receitas e despesas por mês">${g}</svg>`;
}
const addDays=(d,n)=>{ const [y,m,dd]=d.split('-').map(Number); const x=new Date(y,m-1,dd+n); return mkey(x)+'-'+pad2(x.getDate()); };
function spendNow(who){ // período do salário atual (hoje) e o próximo salário
  const t=today(), TM=t.slice(0,7), pl=payPlan(TM,who); let g=null, next=null;
  pl.groups.forEach(x=>{ if(x.date<=t) g=x; });
  if(!g){ const prev=payPlan(madd(TM,-1),who); g=prev.groups[prev.groups.length-1]; next=pl.groups[0]; }
  else { next=pl.groups[pl.groups.indexOf(g)+1] || payPlan(madd(TM,1),who).groups[0]; }
  return g ? {g,next} : null;
}
function upcoming(days){ // contas não pagas: vencidas (até 60 dias) e as que vencem nos próximos dias
  const t=today(), TM=t.slice(0,7), lim=addDays(t,days), from=addDays(t,-60), seen=new Set(), out=[];
  [-2,-1,0,1].forEach(o=>obligations(madd(TM,o)).forEach(x=>{
    const key=x.kind==='card'?'c|'+x.card+'|'+x.who+'|'+x.D:x.kind+'|'+x.o.id+'|'+x.D;
    if(seen.has(key)) return; seen.add(key);
    if(!x.paid && x.due<=lim && x.due>=from) out.push(x); }));
  return out.sort((a,b)=>a.due.localeCompare(b.due));
}
const cardLimit = c => (db.cardInfo&&db.cardInfo[c]&&db.cardInfo[c].limit) || 0;
function limitUsed(c, skipId){ // parcelas de faturas deste mês em diante que ainda não foram pagas

}

// Tudo o que vence no mês M (pela data de vencimento): fixas, variáveis e faturas dos cartões
function dueItems(M){
  const out=[];
  fixedIn(M).forEach(f=>out.push({kind:'fix',o:f,who:f.payer,D:M,due:dueFixed(f,M),value:fixedValue(f,M),paid:f.paid&&f.paid[M],desc:f.desc}));
  db.variable.forEach(v=>{ const due=dueVar(v); if(due&&due.slice(0,7)===M) out.push({kind:'var',o:v,who:v.payer,D:M,due,value:v.value,paid:v.paid,desc:v.desc}); });
  const fat={}; purchasesIn(M).forEach(p=>{ const k=p.card+'|'+p.owner; (fat[k]=fat[k]||{card:p.card,who:p.owner,value:0,n:0}); fat[k].value+=p.inst; fat[k].n++; });
  Object.values(fat).forEach(x=>out.push({kind:'card',card:x.card,who:x.who,D:M,due:dueCard(x.card,M),value:Math.round(x.value*100)/100,n:x.n,paid:db.cardPaid[cpKey(M,x.card,x.who)],desc:'Fatura '+x.card}));
  return out.sort((a,b)=>a.due.localeCompare(b.due)||a.desc.localeCompare(b.desc));
}
let cView='list', calSel=null;
function dueStatus(x,t){ return x.paid?'paid':(x.due<t?'late':'open'); }
function contaRowHTML(x){
  const t=today(), st=dueStatus(x,t), o=x.o;
  const chip = x.kind==='fix'?'<span class="chip fix">Fixa</span>':x.kind==='var'?'<span class="chip var">Variável</span>':'<span class="chip card">Cartão</span>';
  const check = x.kind==='card'
    ? `<button class="check ${x.paid?'on':''}" data-cpay="${esc(x.card)}|${x.who}" data-pm="${x.D}" aria-label="Marcar como pago">${x.paid?'✓':''}</button>`
    : `<button class="check ${x.paid?'on':''}" data-pay="${x.kind}:${o.id}" data-pm="${x.D}" aria-label="Marcar como pago">${x.paid?'✓':''}</button>`;
  const pay = x.kind==='card' ? (()=>{ const ci=db.cardInfo[x.card]||{}, r=resolvePay(x.who,ci.pay&&ci.pay[x.who],x.due); return r?`<div class="sub">salário de ${dshort(r.date)}</div>`:''; })()
    : (()=>{ const r=resolvePay(o.payer,o.payWith,x.due); return r?`<div class="sub">salário de ${dshort(r.date)}</div>`:''; })();
  const detail = x.kind==='card' ? `${x.n} parcela${x.n>1?'s':''}` : esc(o.cat)+(o.method?' · '+METH[o.method]:'');
  return `<div class="item" ${x.kind==='card'?'data-goto="cartao"':`data-edit="${x.kind}:${o.id}" data-pm="${x.D}"`}>
    ${check}
    <div class="main"><div class="title">${esc(x.desc)}</div>
      <div class="sub">${chip}<span class="chip ${x.who}">${esc(pname(x.who))}</span>${detail}</div>${pay}${paidLine(x.paid)}${o&&o.obs?`<div class="obs">${esc(o.obs)}</div>`:''}</div>
    <div class="val">${brl(x.value)}<small class="${st==='late'?'neg':''}">${st==='late'?'⚠ venceu ':'vence '}${dshort(x.due)}</small>${x.kind==='fix'&&x.value!==o.value?'<small>valor do mês</small>':''}</div></div>`;
}
const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const dayLabel=d=>{ const [y,m,dd]=d.split('-').map(Number); const w=new Date(y,m-1,dd).getDay(); return WD[w]+', '+dshort(d); };
function renderContas(){

        ${total?`<div class="bbar"><i style="width:${paid/total*100}%;background:var(--brand)"></i></div>`:''}</div>`;

      cells+=`<button class="cday ${k===t?'today':''} ${k===calSel?'sel':''}" data-cal="${k}" aria-label="${dshort(k)}${its.length?', '+its.length+' conta(s)':''}">

    const sel=items.filter(i=>i.due===calSel);
    html+=`<div class="card"><div class="cal">${WD.map(w=>`<div class="cwd">${w[0]}</div>`).join('')}${cells}</div>

  }
  view.innerHTML=html;
}

  if(fCard.who!=='all') Object.values(fat).forEach(v=>{ v[fCard.who==='p1'?'p2':'p1']=0; });

  const oldBtn=document.getElementById('oldUp');
  if(oldBtn) oldBtn.onclick=()=>{ let d; try{ d=JSON.parse(localStorage.getItem(OLDKEY)); }catch(e){}
    if(!d) return; toast('Enviando…');
    importAll(d,false).then(()=>{ localStorage.setItem(OLDKEY+'-enviado',localStorage.getItem(OLDKEY)); localStorage.removeItem(OLDKEY); toast('Dados enviados para a nuvem'); render(); }).catch(writeErr); };
  document.getElementById('lockCfg').onclick=()=>formLock();
  if(document.getElementById('lockNow')) document.getElementById('lockNow').onclick=()=>showLock();
  document.getElementById('logout').onclick=()=>{ if(confirm('Sair desta conta neste aparelho?')) signOut(auth); };
}

/* ---------- Formulários ---------- */
function opts(list,cur,newLabel){ const l=cur&&!list.includes(cur)?[...list,cur]:list;
  return l.map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('') + (newLabel?`<option value="__new__">${esc(newLabel)}</option>`:''); }
// "+ Nova categoria…" / "+ Novo cartão…" direto no formulário
function wireNewOption(sel){
  const key=sel.dataset.list, ask=key==='cards'?'Nome do novo cartão:':'Nome da nova categoria:';
  let prev=sel.value;
  sel.addEventListener('focus',()=>{ if(sel.value!=='__new__') prev=sel.value; });
  sel.addEventListener('change',()=>{
    if(sel.value!=='__new__'){ prev=sel.value; return; }
    const name=(prompt(ask)||'').trim();
    if(!name){ sel.value=prev; return; }
    const found=db[key].find(x=>x.toLowerCase()===name.toLowerCase());
    const val=found||name;
    if(!found){ db[key].push(name); putConfig(); toast(key==='cards'?'Cartão adicionado':'Categoria adicionada'); }
    if(![...sel.options].some(o=>o.value===val)){ const o=document.createElement('option'); o.textContent=val; sel.insertBefore(o, sel.querySelector('option[value="__new__"]')); }
    sel.value=val; prev=val;
  });
}
function pickHTML(name,cur){ return `<div class="pick" data-pick="${name}">${['p1','p2'].map(p=>`<button type="button" data-v="${p}" class="${p} ${cur===p?'on':''}">${esc(pname(p))}</button>`).join('')}</div>`; }
function openSheet(html,onMount){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="sheet">${html}</div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
  ov.querySelectorAll('.pick').forEach(pk=>pk.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    pk.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); pk.dataset.val=b.dataset.v; }));
  ov.querySelectorAll('.pick').forEach(pk=>{ const on=pk.querySelector('.on'); if(on) pk.dataset.val=on.dataset.v; });
  ov.querySelectorAll('select[data-list]').forEach(wireNewOption);
  document.body.appendChild(ov); onMount(ov, ()=>ov.remove());
}
const today = () => { const d=new Date(); return mkey(d)+'-'+String(d.getDate()).padStart(2,'0'); };
function defaultDate(){ return month===mkey(new Date()) ? today() : month+'-01'; }

const METH={dinheiro:'Dinheiro',debito:'Débito',pix:'Pix',credito:'Crédito'};
// Fatura em que cai a 1ª parcela: considera o fechamento ~7 dias antes do vencimento do cartão
function suggestFirst(card, date){
  let M=date.slice(0,7);
  for(let i=0;i<3;i++){ const close=addDays(dueCard(card,M),-7); if(date<close) return M; M=madd(M,1); }
  return M;
}
function formConta(kind,o,dm){

      <p class="hint">Para contas que mudam todo mês (água, luz, condomínio): deixe o valor de costume acima e informe aqui o valor deste mês.</p></div>
    <div id="fixEnd"><label class="f">Termina em (opcional)<input id="end" type="month" value="${esc(o.end||'')}"></label><p class="hint">Deixe vazio se a conta continua. Preencha quando ela acabar, para não sumir do histórico.</p></div>
    <div id="varFields" class="f2"><label class="f">Data da despesa<input id="date" type="date" value="${esc(o.date||defaultDate())}"></label>
      <label class="f" id="dueWrap">Pagar até<input id="due" type="date" value="${esc(o.due||o.date||defaultDate())}"></label></div>
    <div id="payBox">
    <label class="f">Pagar com o salário<select id="payWith"></select></label>
    <p class="hint" id="payHint"></p>
    <label class="f"><span id="paidLabel">Pago em</span><input id="paidAt" type="datetime-local" value="${esc(typeof paidNow==='string'&&paidNow.includes('T')?paidNow:'')}"></label>

    <div class="actions">${isNew?'':'<button class="btn danger" id="del">Excluir</button>'}<button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="ok">Salvar</button></div>`,
  (ov,close)=>{
    const $=id=>ov.querySelector('#'+id);
    const kindPick=$('kind'); kindPick.dataset.val=kind;
    let picked = o.payWith ? {...o.payWith} : null, dueTouched = !!(o.due && o.due!==o.date);
    const curPayer=()=>ov.querySelector('[data-pick=payer]').dataset.val;
    const curDue=()=>kindPick.dataset.val==='fix' ? dm+'-'+pad2(Math.min(parseInt($('day').value)||1,lastDay(dm))) : ($('due').value||$('date').value||defaultDate());
    const fillPay=()=>{ const who=curPayer(), due=curDue(), isFix=kindPick.dataset.val==='fix';
      const cur = (picked && paysOf(who).some(x=>x.id===picked.pd)) ? picked : autoPay(who,due);

    mPick.addEventListener('click',()=>setTimeout(syncMethod));
    ['value','cn','date'].forEach(id=>$(id).addEventListener('input',credShow));
    $('cfirst').addEventListener('input',()=>{ firstTouched=true; credShow(); });
    $('ccard').addEventListener('change',()=>setTimeout(credShow,50));
    const sync=()=>{ const k=kindPick.dataset.val; syncMethod(); if(isNew) $('ftitle').textContent = k==='var'?'Nova despesa':'Nova conta fixa'; $('paidLabel').textContent = k==='fix' ? 'Pago em (conta de '+mlabel(dm).toLowerCase()+')' : 'Pago em'; $('fixFields').style.display=k==='fix'?'':'none'; $('fixEnd').style.display=k==='fix'?'':'none'; $('fixMonth').style.display=k==='fix'?'':'none'; $('varFields').style.display=k==='var'?'':'none'; fillPay(); };
    kindPick.addEventListener('click',()=>setTimeout(sync)); sync();
    $('cancel').onclick=close;
    if($('del')) $('del').onclick=()=>{ if(!confirm('Excluir esta conta?')) return;
      const arr=kind==='fix'?db.fixed:db.variable; arr.splice(arr.findIndex(x=>x.id===o.id),1); delItem(kind==='fix'?'fixed':'variable',o.id); close(); render(); };
    $('ok').onclick=()=>{
      const k=kindPick.dataset.val, desc=$('desc').value.trim(), value=num($('value').value);
      if(!desc||!value){ toast('Preencha descrição e valor'); return; }
      if(isCredit()){ // vira compra no cartão: entra na fatura e usa o limite

        toast(`Lançado no ${ci.c}${ci.n>1?' em '+ci.n+'×':''} (aba Cartão)`); close(); render(); return;
      }
      const pwv=$('payWith').value.split('|');
      const base={desc,value,cat:$('cat').value,payer:curPayer(),obs:$('obs').value.trim(),payWith:pwv[0]?{pd:pwv[0],off:+pwv[1]}:null};
      const pv=$('paidAt').value, paidVal = pv || (wasPaid && paidNow===true ? true : '');
      if(k==='fix'){
        Object.assign(o,base,{day:parseInt($('day').value)||'',start:$('start').value||month,end:$('end').value||null});
        if(isNew){ o.id=uid(); o.paid={}; db.fixed.push(o); }
        o.paid=o.paid||{}; if(paidVal) o.paid[dm]=paidVal; else delete o.paid[dm];
        const vm=$('valMonth').value.trim(); o.values=o.values||{}; if(vm && num(vm)!==o.value) o.values[dm]=num(vm); else delete o.values[dm];
      } else {
        const m=mPick.dataset.val||null;
        Object.assign(o,base,{date:$('date').value||defaultDate(),due:$('due').value||$('date').value||defaultDate(),method:m});
        let pval=paidVal;
        if(isNew && !pv && ['dinheiro','debito','pix'].includes(m)){ const d=new Date(); pval=o.date+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
        if(isNew){ o.id=uid(); db.variable.push(o); }
        o.paid = pval || false;
      }
      putItem(k==='fix'?'fixed':'variable', o); close(); render();
    };
    if(isNew) setTimeout(()=>{ if(!ov.contains(document.activeElement)) $('desc').focus(); },50);
  });
}

function formCompra(o){
  const isNew=!o;
  o=o||{date:defaultDate(),card:db.cards[0]||'',desc:'',cat:db.categories[0],owner:'p1',n:1,inst:'',first:madd(month,0)};
  openSheet(`<h3>${isNew?'Nova compra no cartão':'Editar compra'}</h3>
    <label class="f">Descrição<input id="desc" value="${esc(o.desc)}" placeholder="Ex.: Geladeira, Mercado"></label>
    <div class="f2"><label class="f">Cartão<select id="card" data-list="cards">${opts(db.cards,o.card,'+ Novo cartão…')}</select></label>
      <label class="f">Categoria<select id="cat" data-list="categories">${opts(db.categories,o.cat,'+ Nova categoria…')}</select></label></div>
    <label class="f">De quem é o gasto${pickHTML('owner',o.owner)}</label>
    <div class="f2"><label class="f">Parcelas<input id="n" type="number" min="1" max="72" inputmode="numeric" value="${esc(o.n)}"></label>
      <label class="f">Valor da parcela (R$)<input id="inst" inputmode="decimal" value="${fmtIn(o.inst)}" placeholder="0,00"></label></div>
    <label class="f">Valor total (R$)<input id="total" inputmode="decimal" value="${o.inst?fmtIn(Math.round(o.inst*o.n*100)/100):''}" placeholder="0,00"></label>
    <p class="hint" id="limHint"></p>
    <p class="hint">Preencha a parcela ou o total, o outro é calculado. Com juros, informe o valor da parcela da fatura.</p>
    <div class="f2"><label class="f">Data da compra<input id="date" type="date" value="${esc(o.date)}"></label>
      <label class="f">1ª parcela na fatura de<input id="first" type="month" value="${esc(o.first)}"></label></div>
    <label class="f">Observação<input id="obs" value="${esc(o.obs||'')}" placeholder="Opcional"></label>
    <p class="hint">A parcela entra na fatura do cartão e cai no salário de quem fez o gasto, conforme o vencimento do cartão (Ajustes → Cartões).</p>
    <div class="actions">${isNew?'':'<button class="btn danger" id="del">Excluir</button>'}<button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="ok">Salvar</button></div>`,
  (ov,close)=>{
    const $=id=>ov.querySelector('#'+id);
    const n=()=>Math.max(1,parseInt($('n').value)||1);
    $('inst').addEventListener('input',()=>{ const v=num($('inst').value); $('total').value=v?fmtIn(Math.round(v*n()*100)/100):''; });
    $('total').addEventListener('input',()=>{ const v=num($('total').value); $('inst').value=v?fmtIn(Math.round(v/n()*100)/100):''; });
    $('n').addEventListener('input',()=>{ const v=num($('inst').value); if(v) $('total').value=fmtIn(Math.round(v*n()*100)/100); });
    const limInfo=()=>{ const c=$('card').value, L=cardLimit(c); if(!L) return null;
      const free=L-limitUsed(c,o.id), M0=today().slice(0,7), f=$('first').value||month, inst=num($('inst').value);
      let add=0; for(let i=0;i<n();i++){ if(mdiff(M0,madd(f,i))>=0) add+=inst; } return {L,free,add}; };
    const limShow=()=>{ const li=limInfo(), h=$('limHint');
      if(!li){ h.textContent=''; h.classList.remove('neg'); return; }
      const over=li.add>li.free; h.textContent=(over?'⚠ Passa do limite! ':'')+'Limite disponível: '+brl(li.free)+' de '+brl(li.L)+(li.add?' · depois desta compra: '+brl(li.free-li.add):'');
      h.classList.toggle('neg',over); };
    ['inst','total','n','first'].forEach(id=>$(id).addEventListener('input',limShow)); $('card').addEventListener('change',()=>setTimeout(limShow,50)); limShow();
    $('cancel').onclick=close;
    if($('del')) $('del').onclick=()=>{ if(!confirm('Excluir esta compra e todas as parcelas?')) return;
      db.purchases.splice(db.purchases.findIndex(x=>x.id===o.id),1); delItem('purchases',o.id); close(); render(); };
    $('ok').onclick=()=>{
      const desc=$('desc').value.trim(), inst=num($('inst').value);
      if(!desc||!inst){ toast('Preencha descrição e valor'); return; }
      const li=limInfo(); if(li && li.add>li.free && !confirm('Esta compra passa do limite disponível do cartão ('+brl(li.free)+'). Salvar mesmo assim?')) return;
      Object.assign(o,{desc,inst,n:n(),card:$('card').value,cat:$('cat').value,owner:ov.querySelector('[data-pick=owner]').dataset.val,date:$('date').value,first:$('first').value||month,obs:$('obs').value.trim()});
      if(isNew){ o.id=uid(); db.purchases.push(o); }
      putItem('purchases',o); close(); render();
    };
    if(isNew) setTimeout(()=>{ if(!ov.contains(document.activeElement)) $('desc').focus(); },50);
  });
}

function chooseAdd(){
  openSheet(`<h3>Adicionar</h3>
    <button class="btn primary" style="width:100%;margin-bottom:10px" id="cR">+ Receita (salário extra, férias, 13º, INSS…)</button>
    <button class="btn" style="width:100%;margin-bottom:10px" id="cG">Guardar dinheiro numa caixinha</button>
    <button class="btn" style="width:100%;margin-bottom:10px" id="cS">↩ Resgatar de uma caixinha</button>
    <button class="btn" style="width:100%;background:none" id="cancel">Cancelar</button>`,
  (ov,close)=>{ const $=id=>ov.querySelector('#'+id); $('cancel').onclick=close;
    $('cR').onclick=()=>{ close(); formReceita(); }; $('cG').onclick=()=>{ close(); formGuardar(null,'in'); }; $('cS').onclick=()=>{ close(); formGuardar(null,'out'); }; });
}
function formGuardar(o, kind, presetBox){
  const isNew=!o; db.boxes=db.boxes||[...DEFAULT.boxes];
  o=o||{box:presetBox||db.boxes[0]||'Poupança',who:'p1',kind:kind||'in',value:'',date:defaultDate(),monthly:false,end:null,obs:''};
  openSheet(`<h3>${isNew?(o.kind==='out'?'Resgatar de uma caixinha':'Guardar dinheiro'):'Editar'}</h3>
    <label class="f">Tipo<div class="pick" id="kind">
      <button type="button" data-v="in" class="neutral ${o.kind!=='out'?'on':''}">Guardar</button>
      <button type="button" data-v="out" class="neutral ${o.kind==='out'?'on':''}">Resgatar</button></div></label>
    <div class="f2"><label class="f">Valor (R$)<input id="value" inputmode="decimal" value="${fmtIn(o.value)}" placeholder="0,00"></label>
      <label class="f">Caixinha<select id="box" data-list="boxes">${opts(db.boxes,o.box,'+ Nova caixinha…')}</select></label></div>
    <p class="hint" id="balHint"></p>
    <label class="f">De quem${pickHTML('who',o.who)}</label>
    <label class="f">Data<input id="date" type="date" value="${esc(o.date)}"></label>
    <label class="f" style="display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:500"><input type="checkbox" id="monthly" ${o.monthly?'checked':''} style="width:auto;margin:0"> Repetir todo mês nesse dia</label>
    <div id="endBox"><label class="f">Termina em (opcional)<input id="end" type="month" value="${esc(o.end||'')}"></label></div>
    <label class="f">Observação<input id="obs" value="${esc(o.obs||'')}" placeholder="Ex.: reserva de emergência"></label>
    <p class="hint">Guardar sai do saldo do salário daquele período (como uma conta). Resgatar volta para o saldo.</p>
    <div class="actions">${isNew?'':'<button class="btn danger" id="del">Excluir</button>'}<button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="ok">Salvar</button></div>`,
  (ov,close)=>{
    const $=id=>ov.querySelector('#'+id); const kp=$('kind'); kp.dataset.val=o.kind||'in';
    const bal=()=>{ $('balHint').textContent='Saldo atual de '+$('box').value+': '+brl(boxBalance($('box').value)); };
    $('box').addEventListener('change',()=>setTimeout(bal,50)); bal();
    const syncEnd=()=>{ $('endBox').style.display=$('monthly').checked?'':'none'; }; $('monthly').addEventListener('change',syncEnd); syncEnd();
    $('cancel').onclick=close;
    if($('del')) $('del').onclick=()=>{ if(!confirm('Excluir este lançamento?')) return; db.savings.splice(db.savings.findIndex(x=>x.id===o.id),1); delItem('savings',o.id); close(); render(); };
    $('ok').onclick=()=>{
      const value=num($('value').value), date=$('date').value, box=$('box').value;
      if(!value||!date||box==='__new__'){ toast('Preencha valor, caixinha e data'); return; }
      if(kp.dataset.val==='out' && value>boxBalance(box) && !confirm('O valor é maior que o saldo atual da caixinha ('+brl(boxBalance(box))+'). Salvar mesmo assim?')) return;
      Object.assign(o,{box,value,date,kind:kp.dataset.val,who:ov.querySelector('[data-pick=who]').dataset.val,monthly:$('monthly').checked,end:$('monthly').checked?($('end').value||null):null,obs:$('obs').value.trim()});
      if(isNew){ o.id=uid(); db.savings=db.savings||[]; db.savings.push(o); }
      putItem('savings',o); close(); render();
    };
  });
}
function boxHistory(box){
  const t=today(), list=(db.savings||[]).filter(x=>x.box===box).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  openSheet(`<h3>${esc(box)}</h3>
    <div class="big">${brl(boxBalance(box))}</div><p class="muted" style="margin-top:0">saldo até hoje (${dshort(t)})</p>
    ${list.length?list.map(x=>`<div class="item" data-hsav="${x.id}">
      <div class="main"><div class="title">${x.kind==='out'?'Resgate':'Guardado'}${x.monthly?' · todo mês':''}</div><div class="sub"><span class="chip ${x.who}">${esc(pname(x.who))}</span>${dlabel(x.date)}${x.date>t?' · futuro':''}</div>${x.obs?`<div class="obs">${esc(x.obs)}</div>`:''}</div>
      <div class="val ${x.kind==='out'?'neg':'pos'}">${x.kind==='out'?'−':'+'} ${brl(x.value)}</div></div>`).join(''):'<div class="empty">Nenhum lançamento ainda.</div>'}
    <div class="actions" style="margin-top:12px"><button class="btn" id="cancel">Fechar</button><button class="btn primary" id="add">Guardar</button></div>`,
  (ov,close)=>{ ov.querySelector('#cancel').onclick=close;
    ov.querySelector('#add').onclick=()=>{ close(); formGuardar(null,'in',box); };
    ov.querySelectorAll('[data-hsav]').forEach(el=>el.onclick=()=>{ close(); formGuardar(db.savings.find(x=>x.id===el.dataset.hsav)); }); });
}

function formReceita(o){
  const isNew=!o;
  o=o||{desc:'',cat:'Extra',value:'',who:'p1',date:defaultDate(),monthly:false,end:null,obs:''};
  db.incomeCats=db.incomeCats||[...DEFAULT.incomeCats];
  openSheet(`<h3>${isNew?'Nova receita':'Editar receita'}</h3>
    <label class="f">Nome<input id="desc" value="${esc(o.desc)}" placeholder="Ex.: Férias, 1ª parcela do 13º, Freela"></label>
    <div class="f2"><label class="f">Valor (R$)<input id="value" inputmode="decimal" value="${fmtIn(o.value)}" placeholder="0,00"></label>
      <label class="f">Categoria<select id="cat" data-list="incomeCats">${opts(db.incomeCats,o.cat,'+ Nova categoria…')}</select></label></div>
    <label class="f">De quem é a receita${pickHTML('who',o.who)}</label>
    <label class="f">Data em que entra<input id="date" type="date" value="${esc(o.date)}"></label>
    <label class="f" style="display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:500"><input type="checkbox" id="monthly" ${o.monthly?'checked':''} style="width:auto;margin:0"> Repete todo mês nesse dia (ex.: INSS)</label>
    <div id="endBox"><label class="f">Termina em (opcional)<input id="end" type="month" value="${esc(o.end||'')}"></label></div>
    <label class="f">Observação<input id="obs" value="${esc(o.obs||'')}" placeholder="Opcional"></label>
    <p class="hint">A receita entra no saldo do salário recebido antes dela no mesmo mês, na aba Salários.</p>
    <div class="actions">${isNew?'':'<button class="btn danger" id="del">Excluir</button>'}<button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="ok">Salvar</button></div>`,
  (ov,close)=>{
    const $=id=>ov.querySelector('#'+id);
    const syncEnd=()=>{ $('endBox').style.display=$('monthly').checked?'':'none'; }; $('monthly').addEventListener('change',syncEnd); syncEnd();
    $('cancel').onclick=close;
    if($('del')) $('del').onclick=()=>{ if(!confirm('Excluir esta receita?')) return;
      db.receitas.splice(db.receitas.findIndex(x=>x.id===o.id),1); delItem('receitas',o.id); close(); render(); };
    $('ok').onclick=()=>{
      const desc=$('desc').value.trim(), value=num($('value').value), date=$('date').value;
      if(!desc||!value||!date){ toast('Preencha nome, valor e data'); return; }
      Object.assign(o,{desc,value,date,cat:$('cat').value,who:ov.querySelector('[data-pick=who]').dataset.val,monthly:$('monthly').checked,end:$('monthly').checked?($('end').value||null):null,obs:$('obs').value.trim()});
      if(isNew){ o.id=uid(); db.receitas=db.receitas||[]; db.receitas.push(o); }
      putItem('receitas',o); close(); render();
    };
    if(isNew) setTimeout(()=>{ if(!ov.contains(document.activeElement)) $('desc').focus(); },50);
  });
}

function formCartao(name){
  db.cardInfo=db.cardInfo||{}; const ci=db.cardInfo[name]||{}, pay=ci.pay||{};
  const rel=(w)=>{ const pays=paysOf(w); if(!pays.length) return `<option value="">Cadastre os salários de ${esc(pname(w))}</option>`;
    const cur=pay[w]?pay[w].pd+'|'+pay[w].off:'';
    return `<option value="" ${cur?'':'selected'}>Automático: último salário antes do vencimento</option>` + [-1,0].flatMap(off=>pays.map(p=>{ const v=p.id+'|'+off;
      return `<option value="${v}" ${v===cur?'selected':''}>${esc(payLabel(p))} do ${off?'mês anterior ao vencimento':'mesmo mês do vencimento'}</option>`; })).join(''); };
  openSheet(`<h3>${esc(name)}</h3>
    <div class="f2"><label class="f">Dia do vencimento da fatura<input id="due" type="number" min="1" max="31" inputmode="numeric" value="${esc(ci.due||'')}" placeholder="Ex.: 10"></label>
      <label class="f">Limite do cartão (R$)<input id="limit" inputmode="decimal" value="${ci.limit?fmtIn(ci.limit):''}" placeholder="Opcional"></label></div>
    <p class="hint">A fatura de um mês vence nesse dia daquele mês. Ex.: as parcelas da fatura de dezembro vencem no dia 10/12.</p>
    ${['p1','p2'].map(w=>`<label class="f">Parte de ${esc(pname(w))}: pagar com<select id="pay_${w}">${rel(w)}</select></label>`).join('')}
    <p class="hint" id="exHint"></p>
    <div class="actions"><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="ok">Salvar</button></div>`,
  (ov,close)=>{
    const $=id=>ov.querySelector('#'+id);
    const ex=()=>{ const d=parseInt($('due').value)||10, D=madd(month,1), due=D+'-'+pad2(Math.min(d,lastDay(D)));
      $('exHint').textContent='Exemplo, fatura de '+mlabel(D).toLowerCase()+' (vence '+dshort(due)+'): '+['p1','p2'].map(w=>{ const v=$('pay_'+w).value.split('|'), r=resolvePay(w,v[0]?{pd:v[0],off:+v[1]}:null,due); return pname(w)+' → '+(r?'salário de '+dshort(r.date):'sem salário'); }).join(' · '); };
    ['due','pay_p1','pay_p2'].forEach(id=>$(id).addEventListener('input',ex)); ex();
    $('cancel').onclick=close;
    $('ok').onclick=()=>{ const p={}; ['p1','p2'].forEach(w=>{ const v=$('pay_'+w).value.split('|'); if(v[0]) p[w]={pd:v[0],off:+v[1]}; });
      db.cardInfo[name]={due:Math.max(1,Math.min(31,parseInt($('due').value)||10)),pay:p,limit:num($('limit').value)||0}; putConfig(); close(); render(); };
  });
}

/* ---------- Eventos ---------- */
document.getElementById('prev').onclick=()=>{ month=madd(month,-1); render(); };
document.getElementById('next').onclick=()=>{ month=madd(month,1); render(); };
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); window.scrollTo(0,0); });
document.getElementById('fab').onclick=()=>{ tab==='resumo'?formConta('var'):tab==='cartao'?formCompra():tab==='salarios'?chooseAdd():fContas.type==='card'?formCompra():formConta(fContas.type==='fix'?'fix':'var'); };
view.addEventListener('click',e=>{
  const t=e.target.closest('[data-cview],[data-cal],[data-budget],[data-sav],[data-box],[data-addsav],[data-delbox],[data-pmonth],[data-gomonth],[data-pwho],[data-pcat],[data-rec],[data-income],[data-goto],[data-cardcfg],[data-cpay],[data-pay],[data-edit],[data-type],[data-who],[data-cwho],[data-ccard],[data-call],[data-delcat],[data-delcard]');
  if(!t) return;
  const d=t.dataset;
  const pm=d.pm||month;
  if(d.cview){ cView=d.cview; render(); return; }
  if(d.cal){ calSel=d.cal; render(); return; }
  if(d.budget){ formBudget(d.budget); return; }
  if(d.sav){ formGuardar(db.savings.find(x=>x.id===d.sav)); return; }
  if(d.box){ boxHistory(d.box); return; }
  if(d.addsav){ formGuardar(null,d.addsav); return; }
  if(d.delbox!==undefined){ if(!confirm('Remover esta caixinha da lista? O histórico dela continua salvo.')) return; db.boxes.splice(+d.delbox,1); putConfig(); render(); return; }
  if(d.pmonth){ pSel=d.pmonth; render(); return; }
  if(d.gomonth){ month=d.gomonth; tab='salarios'; render(); window.scrollTo(0,0); return; }
  if(d.pwho){ pWho=d.pwho; render(); return; }
  if(d.pcat){ pCat=d.pcat; render(); return; }
  if(d.rec){ formReceita(db.receitas.find(x=>x.id===d.rec)); return; }
  if(d.goto){ tab=d.goto; render(); window.scrollTo(0,0); return; }
  if(d.cardcfg!==undefined){ formCartao(d.cardcfg); return; }
  if(d.income){ const [w,id]=d.income.split('|'), pay=paysOf(w).find(x=>x.id===id); if(!pay) return;
    const k=incKey(month,w,id), cur=payAmount(month,w,pay);
    const ans=prompt(`Valor recebido no salário de ${dshort(payDate(pay,month))} (${mlabel(month)}).\nDeixe vazio para usar o valor padrão (${brl(pay.amount||0)}).`, fmtIn(cur));
    if(ans===null) return;
    if(ans.trim()===''){ delete db.incomeMonth[k]; setIncome(k,null); } else { const v=num(ans); db.incomeMonth[k]=v; setIncome(k,v); }
    render(); return; }
  if(d.cpay){ const i=d.cpay.lastIndexOf('|'), c=d.cpay.slice(0,i), w=d.cpay.slice(i+1), k=cpKey(pm,c,w);
    db.cardPaid=db.cardPaid||{}; if(db.cardPaid[k]) delete db.cardPaid[k]; else db.cardPaid[k]=nowStamp();
    setCardPaid(k, db.cardPaid[k]||null); render(); return; }
  if(d.pay){ e.stopPropagation(); const [k,id]=d.pay.split(':');
    if(k==='fix'){ const f=db.fixed.find(x=>x.id===id); f.paid=f.paid||{}; if(f.paid[pm]) delete f.paid[pm]; else f.paid[pm]=nowStamp(); putItem('fixed',f); }
    else { const v=db.variable.find(x=>x.id===id); v.paid=v.paid?false:nowStamp(); putItem('variable',v); }
    render(); return; }
  if(d.edit){ const [k,id]=d.edit.split(':');
    if(k==='fix') formConta('fix',db.fixed.find(x=>x.id===id),pm);
    else if(k==='var') formConta('var',db.variable.find(x=>x.id===id),pm);
    else formCompra(db.purchases.find(x=>x.id===id)); return; }
  if(d.type){ fContas.type=d.type; } else if(d.who){ fContas.who=d.who; }
  else if(d.cwho){ fCard.who=d.cwho; } else if(d.ccard){ fCard.card=d.ccard; } else if(d.call){ fCard.all=d.call==='all'; }
  else if(d.delcat!==undefined){ if(!confirm('Remover esta categoria da lista? Lançamentos já feitos continuam com ela.')) return; db.categories.splice(+d.delcat,1); putConfig(); }
  else if(d.delcard!==undefined){ if(!confirm('Remover este cartão da lista? Compras já lançadas continuam com ele.')) return; db.cards.splice(+d.delcard,1); putConfig(); }
  render();
});

if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
